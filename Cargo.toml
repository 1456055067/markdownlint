[package]
name = "markdownlint"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
description = "A Rust port of markdownlint - A style checker and lint tool for Markdown/CommonMark files"
homepage = "https://github.com/YOUR_USERNAME/markdownlint"
repository = "https://github.com/YOUR_USERNAME/markdownlint"
readme = "README.md"
keywords = ["markdown", "lint", "commonmark", "linter", "checker"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
rust-version = "1.70"

[lib]
name = "markdownlint"
path = "src/lib.rs"

[[bin]]
name = "markdownlint"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Markdown parsing
comrak = { version = "0.28", default-features = false, features = ["syntect"] }

# Async runtime (optional, for async API)
tokio = { version = "1.41", features = ["rt-multi-thread", "fs", "io-util"], optional = true }

# Parallel processing
rayon = "1.10"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
regex = "1.11"
once_cell = "1.20"
unicode-width = "0.2"
dashmap = "6.1"

# CLI dependencies (optional)
clap = { version = "4.5", features = ["derive", "cargo"], optional = true }
colored = { version = "2.1", optional = true }
walkdir = { version = "2.5", optional = true }
globset = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1.41", features = ["rt", "macros", "fs"] }
criterion = "0.5"
proptest = "1.5"
tempfile = "3.14"
pretty_assertions = "1.4"
insta = "1.41" # Snapshot testing

[features]
default = ["cli"]
cli = ["dep:clap", "dep:colored", "dep:walkdir", "dep:globset"]
async = ["dep:tokio"]

[[bench]]
name = "lint_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

# Faster builds for development
[profile.dev.package."*"]
opt-level = 2
